name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag splat-transform .

      - name: Run CLI smoke tests
        run: |
          docker run --rm splat-transform --version
          workdir="$RUNNER_TEMP/splat-transform-docker"
          mkdir "$workdir"
          cp test/fixtures/splat/minimal.splat "$workdir/input.splat"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$workdir:/work" splat-transform \
            --gpu cpu input.splat output.ply
          test -s "$workdir/output.ply"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Build Splat Transform
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Run Publint
        run: npm run publint

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run fmt

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Dependencies
        run: npm ci

      - name: Build Docs
        run: npm run docs
